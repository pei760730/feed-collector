name: collect

# ⚠️ 排程已退役(2026-07-15,#9 三併一 Phase 3):of 生產 drain 已移至 collector repo
# collect.yml 的 of matrix job(OF_* secrets,engines/of vendored 引擎;端到端驗證:
# run 29352425723 收錄 ig_DYHSZWszCB0 pending_review 真訊息落暫存區)。本檔留
# workflow_dispatch 當備援 —— 同一隻 bot 同一張表,緊急時手動補跑一輪,行為完全相同。
on:
  workflow_dispatch: {} # 備援手動補跑(生產排程在 collector repo)

permissions:
  contents: read

# 同時只跑一個,避免兩個 job 並行領 getUpdates 互搶(會漏 ack)。
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 保險:任何意外卡死 10 分鐘殺掉,別吃滿額度、堵住後續 cron
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: drain
        # 留存輸出供失敗通知擷取真因。shell: bash 必須顯式寫 —— 只有顯式指定才會拿到
        # `-eo pipefail`(預設 shell 是 `bash -e {0}`,無 pipefail,npm 掛掉會被 tee 吞成綠燈,
        # 下面 if: failure() 的告警永不觸發)。
        shell: bash
        run: npm run drain 2>&1 | tee drain.log
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          STAGING_SHEET_NAME: 暫存區
          STORAGE: sheets
          # 展開短網址(vm./vt.tiktok、xhslink…):不開的話短連結與展開後的去重各算各的(無人值守 cron 的靜默去重漏洞)。
          # 展開失敗會 graceful fallback 回原網址(見 expandUrl.ts),不會擋流程。
          EXPAND_SHORT_URLS: "true"
          # 來源白名單:只收這些 chat/user id 的訊息(公開後防陌生人灌池)。
          # 必設 —— 沒設 sheets 模式會 fail-fast 直接紅燈(寧可不跑,也不要大開)。
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
          # 寫表失敗時的 Telegram 告警對象(從 secret 注入;沒設 notifyError 會 no-op)。
          ERROR_CHAT_ID: ${{ secrets.ERROR_CHAT_ID }}

      # 失敗才報:drain job 崩潰時抓 log 尾巴真因,收攏推到統一通知 bot(@MYNOOTIFYBot),走 kai-notify(fail-soft)。
      - name: Build failure message
        if: failure()
        id: failmsg
        run: |
          ERR=$(grep -iE 'ERROR|Error:|錯誤|失敗' drain.log 2>/dev/null | tail -n 2 | tr '\n' ' ' | python3 -c 'import sys;sys.stdout.write(sys.stdin.buffer.read().decode("utf-8","replace")[:280])')
          [ -z "$ERR" ] && ERR="(未擷取到錯誤,請看 log)"
          echo "text=🔴 feed-collector collect 失敗:${ERR} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - name: Notify Kai on failure (kai-notify)
        if: failure()
        uses: pei760730/kai-notify@v1
        env:
          KAI_NOTIFY_BOT_TOKEN: ${{ secrets.KAI_NOTIFY_BOT_TOKEN }}
          KAI_NOTIFY_CHAT_ID: ${{ secrets.KAI_NOTIFY_CHAT_ID }}
        with:
          text: ${{ steps.failmsg.outputs.text }}
